<script>
/* ============ SOUND FX (sintetizado — nada de voz robótica) ============ */
const AU={ctx:null,on:true,
 init(){if(!this.ctx)this.ctx=new(window.AudioContext||window.webkitAudioContext)()},
 t(f,d,ty='sine',v=.14,sl=0){if(!this.on)return;this.init();
  const c=this.ctx,o=c.createOscillator(),g=c.createGain();
  o.type=ty;o.frequency.setValueAtTime(f,c.currentTime);
  if(sl)o.frequency.exponentialRampToValueAtTime(sl,c.currentTime+d);
  g.gain.setValueAtTime(0,c.currentTime);g.gain.linearRampToValueAtTime(v,c.currentTime+.012);
  g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d);
  o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)},
 click(){this.t(620,.07,'triangle',.09)},
 correct(){this.t(660,.12);setTimeout(()=>this.t(880,.22),90)},
 wrong(){this.t(190,.26,'sawtooth',.1,120)},
 unlock(){[523,659,784].forEach((f,i)=>setTimeout(()=>this.t(f,.3,'triangle',.13),i*95))},
 clear(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>this.t(f,.5,'sine',.15),i*130))}};

/* ============ VOZ — narração gravada ============ */
const VOICE={map:{},tx:{},base:'audio/',
 async load(){
   try{const r=await fetch(this.base+'voice-map.json');if(r.ok)this.map=await r.json();}catch(e){}
   try{const r=await fetch(this.base+'transcripts.json');if(r.ok)this.tx=await r.json();}catch(e){}
 },
 key(t){return t.trim().toLowerCase().replace(/<[^>]+>/g,'').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ');},
 has(t){return !!this.map[this.key(t)];}};
VOICE.load().then(()=>{try{if(typeof render==='function'&&document.getElementById('stage').innerHTML)render();}catch(e){}});

/* ============ TOCADOR ============ */
const SFX={
  cache:{}, last:null,
  play(f,vol){
    if(!f)return null;
    let a=this.cache[f]||(this.cache[f]=new Audio('audio/'+f));
    a.currentTime=0;a.volume=(vol===undefined?.85:vol);
    a.play().catch(()=>{});
    return a;
  },
  scene(f,vol){ this.last={f:f,v:vol}; this.play(f,vol); this.showReplay(true); },
  again(){ if(this.last)this.play(this.last.f,this.last.v); },
  showReplay(v){
    const b=document.getElementById('replay');
    if(b)b.classList.toggle('on',!!v&&!!this.last);
  },
  clear(){
    Object.values(this.cache).forEach(a=>{try{a.pause();a.currentTime=0;}catch(e){}});
    this.last=null;this.showReplay(false);
  }
};

const BARS=14;
const ICO_PLAY='<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>';
const ICO_PAUSE='<svg viewBox="0 0 24 24"><path d="M7 4h4v16H7zM13 4h4v16h-4z"/></svg>';
let RATE=+(localStorage.getItem('rightnow-rate')||1);

const PLAYER={
  cur:null, box:null, list:[], idx:0,
  stop(){
    if(this.cur){this.cur.onended=null;this.cur.pause();this.cur=null;}
    if(this.box){this.box.classList.remove('playing');
      const sc0=document.getElementById(this.box.dataset.sc||'');
      if(sc0)sc0.querySelectorAll('.ln').forEach(l=>l.classList.remove('now'));
      this.box.querySelector('.pp').innerHTML=ICO_PLAY;
      this.box.querySelectorAll('.wave i').forEach(x=>x.classList.remove('lit'));
      this.setTime(this.box,0,0);}
    this.box=null;this.list=[];this.idx=0;
  },
  setTime(box,c,d){
    const t=box.querySelector('.tm');
    const f=n=>isFinite(n)?Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0'):'0:00';
    t.textContent=d?f(d-c):'0:00';
  },
  tick(){
    if(!this.cur||!this.box)return;
    const p=this.cur.duration?this.cur.currentTime/this.cur.duration:0;
    const bars=this.box.querySelectorAll('.wave i');
    bars.forEach((x,k)=>x.classList.toggle('lit',k/bars.length<=p));
    this.setTime(this.box,this.cur.currentTime,this.cur.duration);
  },
  start(box,list,from){
    if(this.box&&this.box!==box)this.stop();
    this.box=box;this.list=list;this.idx=from||0;
    box.classList.add('playing');
    box.querySelector('.pp').innerHTML=ICO_PAUSE;
    this.next();
  },
  marca(){
    if(!this.box)return;
    const sc=document.getElementById(this.box.dataset.sc||'');
    if(!sc)return;
    sc.querySelectorAll('.ln').forEach((l,k)=>l.classList.toggle('now',k===this.idx));
  },
  next(){
    if(this.idx>=this.list.length){this.stop();return;}
    this.marca();
    const a=new Audio('audio/'+this.list[this.idx]);
    a.playbackRate=RATE;a.volume=.95;
    a.ontimeupdate=()=>this.tick();
    a.onended=()=>{this.idx++;this.next();};
    a.onerror=()=>{this.idx++;this.next();};
    this.cur=a;
    a.play().catch(()=>{this.idx++;this.next();});
  },
  toggle(box,list){
    if(this.box===box&&this.cur){
      if(this.cur.paused){this.cur.play();box.classList.add('playing');
        box.querySelector('.pp').innerHTML=ICO_PAUSE;}
      else{this.cur.pause();box.classList.remove('playing');
        box.querySelector('.pp').innerHTML=ICO_PLAY;}
      return;
    }
    this.start(box,list,0);
  },
  rate(r){
    RATE=r;localStorage.setItem('rightnow-rate',r);
    if(this.cur)this.cur.playbackRate=r;
    document.querySelectorAll('.au .sp').forEach(b=>{
      b.textContent=r===1?'1×':'0.75×';b.classList.toggle('slow',r!==1);});
  }
};

/* o componente. list = um ou mais arquivos tocados em sequência */
let _auN=0;
function AUP(list,label){
  if(!list||!list.length)return '';
  const bars=Array(BARS).fill('<i></i>').join('');
  const temTx=list.some(f=>VOICE.tx[f]);
  const id='sc'+(++_auN);
  const linhas=list.map(f=>`<span class="ln" data-f="${f}">${VOICE.tx[f]||''}</span>`).join('');
  return `<span class="au" data-list="${list.join(',')}" data-sc="${id}" title="${label||'Listen'}">
    <button class="pp" aria-label="Play">${ICO_PLAY}</button>
    <span class="wave">${bars}</span>
    <span class="tm">0:00</span>
    <button class="sp${RATE!==1?' slow':''}">${RATE===1?'1×':'0.75×'}</button>
    ${temTx?'<button class="tx">words</button>':''}
  </span>`
  +(temTx?`<span class="script" id="${id}"><span class="hd">what you hear</span>${linhas}</span>`:'');
}
/* compatível com o resto do código: monta a partir do texto da cena */
function AUB(text){
  const f=VOICE.map[VOICE.key(text)];
  return f?AUP([f]):'';
}
function SEQB(list,label){return AUP(list,label);}

document.addEventListener('click',e=>{
  const box=e.target.closest('.au');
  if(!box)return;
  if(e.target.closest('.sp')){PLAYER.rate(RATE===1?.75:1);return;}
  if(e.target.closest('.tx')){
    const b=e.target.closest('.tx'), sc=document.getElementById(box.dataset.sc||'');
    if(sc){const v=sc.classList.toggle('on');b.classList.toggle('on',v);AU.click();}
    return;
  }
  if(e.target.closest('.wave')){
    if(PLAYER.box===box&&PLAYER.cur&&PLAYER.cur.duration){
      const r=e.target.closest('.wave').getBoundingClientRect();
      PLAYER.cur.currentTime=((e.clientX-r.left)/r.width)*PLAYER.cur.duration;
    } else PLAYER.start(box,box.dataset.list.split(','),0);
    return;
  }
  PLAYER.toggle(box,box.dataset.list.split(','));
});

/* ============ TEXTO ============ */
function T(s){
  if(Array.isArray(s))s=byKnows(s);
  return G(String(s).split('||')[0]);
}
function TB(s){return T(s);}
/* ~word~ vira item clicável do glossário */
function G(s){return String(s).replace(/~([^~]+)~/g,(m,w)=>`<b class="g" data-g="${w.toLowerCase()}">${w}</b>`);}

/* ============ GLOSSÁRIO ============ */
const GLOSS={

   e:'The truck is still at the depot.',pt:'depósito / entreposto'},
 'warehouse':{c:'noun',d:'A very large building where a company keeps its products.',
   e:'We have two thousand boxes in the warehouse.',pt:'galpão, armazém'},

 'invoice':{c:'noun',d:'The paper or email that says how much the client must pay.',
   e:'Did you send the invoice?',pt:'nota fiscal / fatura'},
 'supplier':{c:'noun',d:'The company that sells you the things you need for your work.',

   e:'Four pallets are waiting at the depot.',pt:'palete'},

 'stock':{c:'noun',d:'All the products a company has ready to sell.',
   e:'We have it in stock.',pt:'estoque'}
};
const gEl=document.getElementById('gloss');
function raizGloss(w){
  w=String(w).toLowerCase().trim();
  if(GLOSS[w])return w;
  const tenta=[w.replace(/ies$/,'y'),w.replace(/es$/,''),w.replace(/s$/,''),
               w.replace(/ed$/,''),w.replace(/ed$/,'e'),w.replace(/ing$/,''),w.replace(/ing$/,'e')];
  for(const t of tenta) if(GLOSS[t])return t;
  return null;
}
function openGloss(word,x,y){
  const k=raizGloss(word); if(!k)return;
  const g=GLOSS[k];
  AU.click();
  gEl.innerHTML=`<button class="gx" aria-label="Close">&times;</button>
    <h5>${k}</h5><div class="cls">${g.c}</div>
    <p>${g.d}</p><div class="ex">"${g.e}"</div>
    ${g.pt?`<div class="pt" style="margin-left:0">${g.pt}</div>`:''}
`;
  gEl.classList.add('on');
  const w=gEl.offsetWidth,h=gEl.offsetHeight;
  gEl.style.left=Math.max(12,Math.min(x-w/2,innerWidth-w-12))+'px';
  gEl.style.top=(y-h-16<12?y+24:y-h-16)+'px';
  gEl.querySelector('.gx').onclick=()=>gEl.classList.remove('on');
}
document.addEventListener('click',e=>{
  const t=e.target.closest('.g');
  if(t){const r=t.getBoundingClientRect();openGloss(t.dataset.g,r.left+r.width/2,r.top);return;}
  if(!e.target.closest('.gloss'))gEl.classList.remove('on');
});

/* ============ ESTADO ============ */
const S={i:0,xp:0,streak:0,journal:[],found:[]};
function byKnows(a){return Array.isArray(a)?a[0]:a;}
function addXP(n){S.xp+=n;const el=document.getElementById('xp');
 const from=+el.textContent,to=S.xp,t0=performance.now();
 (function tick(t){const p=Math.min((t-t0)/450,1);el.textContent=Math.round(from+(to-from)*p);
  if(p<1)requestAnimationFrame(tick)})(t0);}
function hit(){S.streak++;const s=document.getElementById('stk');
 if(S.streak>=2){s.textContent='🔥 '+S.streak;s.classList.add('show')}}
function miss(){S.streak=0;document.getElementById('stk').classList.remove('show')}
function burst(txt){AU.clear();
 const d=document.createElement('div');d.className='burst';
 d.innerHTML='<div class="txt">'+txt+'</div>';document.body.appendChild(d);
 for(let i=0;i<70;i++){const c=document.createElement('div');c.className='conf';
  c.style.left=Math.random()*100+'vw';c.style.top='-20px';
  c.style.background=['#ff8f6e','#9294bb','#7fd39b','#f2f1f7'][i%4];
  c.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(c);
  setTimeout(()=>c.remove(),3200);}
 setTimeout(()=>d.remove(),1600);}

/* ============ RENDER ============ */
const stage=document.getElementById('stage');
function HEAD(eyebrow,title){
  return `<div class="ch2">${eyebrow?`<span class="eyebrow">${eyebrow}</span>`:''}
    <h2>${T(title)}</h2><span class="rule"></span></div>`;
}
function ORIGINALS(){
  return `<div class="originals" data-wl-lock>
    <div class="wl">
      <span class="ghost" aria-hidden="true">WOLF LABS</span>
      <span class="real">WOLF LABS</span>
    </div>
    <div class="org"><i></i><b>Originals</b><i></i></div>
    <div class="biz"><span class="bz">Business</span><span class="dot"></span><span class="lv">A1</span></div>
  </div>`;
}
function LTR(i){return `<span class="ltr">${'ABCD'[i]||'•'}</span>`;}

function render(){
  const s=L[S.i];
  let h='';

  if(s.type==='protocol'){
    const acc=(t,body,warn)=>`<details class="acc"><summary>
      <span class="ar"></span>${t}${warn?'<span class="bad"></span>':''}</summary>
      <div class="body">${body}</div></details>`;
    h=`<div class="card mid" style="max-width:780px;text-align:left">
      ${HEAD('Teacher Protocol','Right Now')}
      <p class="lead" style="margin-bottom:20px">It is three o&#39;clock and the boss wants to know what everybody is doing. The student answers for four people, then for themselves.</p>
      <div class="pgrid">
        <div class="pstat"><div class="n">65</div><div class="l">minutes</div></div>
        <div class="pstat"><div class="n">16</div><div class="l">scenes</div></div>
        <div class="pstat"><div class="n">38</div><div class="l">min of talking</div></div>
      </div>`
      +acc('What this lesson does',
        `<p>Module 2 taught <b style="display:inline;color:var(--text);font-family:var(--body);font-size:1em;letter-spacing:0;text-transform:none">present simple</b> — what I do every day. This one adds the pair: <b style="display:inline;color:var(--text);font-family:var(--body);font-size:1em;letter-spacing:0;text-transform:none">present continuous</b>, what is happening at this moment.</p>
         <p>Without it the student cannot say the most useful sentence at work: <em>I am working on it.</em></p>`)
      +acc('The one error to hunt',
        `<p>A1 students drop the helper. <b style="display:inline;color:var(--text);font-family:var(--body);font-size:1em;letter-spacing:0;text-transform:none">He working</b> instead of <b style="display:inline;color:var(--text);font-family:var(--body);font-size:1em;letter-spacing:0;text-transform:none">He is working</b>.</p>
         <p>Scene 2 teaches it, scene 4 makes the screen refuse it, scene 7 tests it, and the final check comes back to it. If they miss check one, go back to scene 2 — do not move on.</p>`,1)
      +acc('The contrast is the mechanic',
        `<p>In scene 3 you click a person and get <b style="display:inline;color:var(--text);font-family:var(--body);font-size:1em;letter-spacing:0;text-transform:none">two lines</b>: grey for every day, orange for right now. Same person, two tenses, one screen.</p>
         <p>Only the orange one is said out loud. The grey one is there to be felt, not read.</p>
         <p>Scene 7 goes further: one card is filled, the other is <b style="display:inline;color:var(--text);font-family:var(--body);font-size:1em;letter-spacing:0;text-transform:none">dashed</b>. The student has to SAY the missing sentence before tapping to check — and the side that is missing alternates, so they cannot go on autopilot.</p>`)
      +acc('Collect errors, hand them back at the end',
        `<p>Scenes 12 and 13 are free production, back to back: the same student, the same job, the two tenses. Do not interrupt.</p>
         <p>Count how many helpers they drop in scene 12. That number is what you work on next class.</p>`)
      +acc('The translation button',
        `<p>A1 students freeze when they do not understand. The button in the top bar shows Portuguese on everything — titles, instructions, story, the grammar cards and the six question cards.</p>
         <p>It is written the way a teacher would <b style="display:inline;color:var(--text);font-family:var(--body);font-size:1em;letter-spacing:0;text-transform:none">say it out loud</b>, not word for word. Turn it on when they hesitate and off again when they are moving.</p>`)
      +acc('Tools',
        `<p>Underlined words open a glossary. The language button shows Portuguese, only when you want it.</p>
         <p>The pencil edits any text or image — swap the four names for people your student actually knows. It stays <b style="display:inline;color:var(--text);font-family:var(--body);font-size:1em;letter-spacing:0;text-transform:none">only on this computer</b>.</p>

      +`<div style="text-align:center"><button class="btn" style="margin-top:26px" onclick="go(1)">Start at three o&#39;clock</button></div></div>`;

      flower:'<circle cx="12" cy="9" r="2.6"/><path d="M12 6.4C12 4 10 3 9 4.5s.6 3.4 3 3.4M12 6.4C12 4 14 3 15 4.5s-.6 3.4-3 3.4M9.4 9C7 9 6 11 7.5 12s3.4-.6 3.4-3M14.6 9C17 9 18 11 16.5 12s-3.4-.6-3.4-3"/><path d="M12 11.6V21"/>'};
    const ICO=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">${ph[k]||''}</svg>`;
    h=`<div class="card">${HEAD(s.ch,s.t)}
      <p class="lead" style="text-align:center">${TB(s.lead)}</p>
      <div class="speak">
        <h3><svg class="ic" style="color:var(--accent2)" viewBox="0 0 24 24"><path d="M8 10h8M8 14h5"/><path d="M21 12a8 8 0 0 1-8 8H7l-4 3v-6.5A8 8 0 0 1 13 4a8 8 0 0 1 8 8Z"/></svg>
          ${G(s.prompt)}</h3>
`+
      (s.picks?`<div class="picks">`+s.picks.map((p,k)=>
        `<div class="pick" data-k="${k}">
           <div class="im" data-bg="${p.img||''}">${ICO(p.ic)}</div>
           <div class="lb">${p.l}</div></div>`).join('')+`</div>`:'')+
      (arena||s.picks?'':`<div style="font-family:var(--mono);font-size:0.76rem;letter-spacing:1.4px;
          color:var(--dim);text-transform:uppercase;margin-top:18px">say it like this</div>
        <div class="starters">`+s.starters.map(x=>`<span class="st">${x}</span>`).join('')+`</div>`)+
      (s.picks?`<div style="font-family:var(--mono);font-size:0.76rem;letter-spacing:1.4px;
          color:var(--dim);text-transform:uppercase;margin-top:18px">say it like this</div>
        <div class="starters">`+s.starters.map(x=>`<span class="st">${x}</span>`).join('')+`</div>`:'')+
      `<div class="timer">
        <span class="lbl">Talk time</span>
        <div class="tbar"><div class="tfill" id="tf"></div></div>
        <div class="tnum" id="tnum">${Math.floor(s.sec/60)}:${String(s.sec%60).padStart(2,'0')}</div>
        <button class="tstart" id="go">Start</button></div>
      </div><div class="fb" id="fb" style="text-align:center"></div></div>`;
  }

  else if(s.type==='rapid'){
    h=`<div class="card narrow" style="text-align:center">${HEAD(s.ch,s.t)}
        <p class="lead">${TB(s.lead)}</p>
        <div id="rw" style="font-family:var(--disp);font-size:2.5rem;color:var(--accent);min-height:84px;
          display:flex;align-items:center;justify-content:center;
          border-top:1px solid rgba(255,143,110,.14);border-bottom:1px solid rgba(255,143,110,.14);
          margin:6px 0 18px;padding:14px 0">Ready?</div>
        <div class="tbar" style="margin-bottom:20px"><div class="tfill" id="tf"></div></div>
        <button class="btn" id="go">Start</button>
        <div class="fb" id="fb"></div></div>`;
  }

  else if(s.type==='chat'){
    h=`<div class="card mid">${HEAD(s.ch,s.t)}
      <p class="lead" style="text-align:center">${TB(s.lead)}</p>
      <div id="chat"></div><div class="fb" id="fb" style="text-align:center"></div></div>`;
  }

  else if(s.type==='find'){
    h=`<div class="card mid">${HEAD(s.ch,s.t)}
      <p class="lead" style="text-align:center">${TB(s.lead)}</p>`+
      s.places.map((p,k)=>`<div class="opt row" data-k="${k}" style="margin-bottom:11px">
        ${LTR(k)}${G(p.l)}</div>`).join('')+
      `<div class="fb" id="fb" style="text-align:center"></div></div>`;
  }

  else if(s.type==='review'){
    h=`<div class="card mid">${HEAD(s.ch,s.t)}
      <p class="lead" style="text-align:center">${TB(s.lead)}</p>
      <div id="rv"></div>
      <div id="rspeak" style="display:none">
        <div class="speak" style="margin-top:22px"><h3>${G(s.prompt)}</h3>
          <div style="font-family:var(--mono);font-size:0.78rem;letter-spacing:1.4px;color:var(--dim);
            text-transform:uppercase;margin-top:18px">say it like this</div>
          <div class="starters">`+s.starters.map(x=>`<span class="st">${x}</span>`).join('')+`</div>
        </div></div>
      <div class="fb" id="fb" style="text-align:center"></div></div>`;
  }

  else if(s.type==='mission'){
    h=`<div class="card mid">${HEAD(s.ch,s.t)}
      <p class="lead" style="text-align:center">${TB(s.lead)}</p>
      <div class="speak" style="margin-top:6px"><h3>${G(s.prompt)}</h3>
      <div class="starters">`+s.starters.map(r=>`<span class="st">${r}</span>`).join('')+`</div></div>
      <div style="text-align:center;margin-top:22px">
        <button class="btn" onclick="go(${S.i+1})">I accept the mission</button></div></div>`;
  }

  else if(s.type==='clear'){
    h=`<div class="card" style="max-width:620px;text-align:center;padding:46px 44px">
      <svg class="ic" style="width:64px;height:64px;color:var(--accent);margin:0 auto 10px" viewBox="0 0 24 24">
        <path d="M7 4h10v5a5 5 0 0 1-10 0Z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/><path d="M10 14h4v6h-4zM8 20h8"/></svg>
      <h1 style="font-size:clamp(1.9rem,4.8vw,3.2rem)">${s.t}</h1>
      <span style="display:block;margin:14px auto 18px;width:70px;height:1px;
        background:linear-gradient(90deg,transparent,var(--accent),transparent)"></span>
      <p style="font-family:var(--mono);color:var(--accent);letter-spacing:1.7px;font-size:1rem">${s.lead}</p>
      <div class="xp" style="margin:22px auto 0;font-size:1.1rem;display:inline-flex">TOTAL ${S.xp+s.xp} XP</div>
      <div style="margin-top:32px;padding-top:26px;border-top:1px solid rgba(255,143,110,.14)">
        ${ORIGINALS()}</div></div>`;
  }

  stage.innerHTML='<div class="scene">'+h+'</div>';
  if(s.pre){
    const hd=stage.querySelector('.ch2');
    if(hd){
      const d=document.createElement('div');
      d.className='pre';
      d.innerHTML=(s.clock?`<span class="clock">${s.clock}</span>`:'')+TB(s.pre)
        +(s.preSeq?SEQB(s.preSeq):AUB(String(s.pre).split('||')[0].replace(/~/g,'')));
      hd.insertAdjacentElement('afterend',d);
    }
  }
  wire(s); ui();
}

/* ============ WIRING ============ */
function wire(s){
  const fb=document.getElementById('fb');

  if(s.type==='review'){
    const box=document.getElementById('rv');let k=0;
    const step=()=>{
      if(k>=s.items.length){
        AU.unlock();addXP(60);burst('READY');
        document.getElementById('rspeak').style.display='block';
        document.querySelectorAll('.st').forEach(x=>x.onclick=()=>x.classList.toggle('on'));
        S.journal.push({k:s.journal||'final check',v:'Passed the review and answered the last question.'});
        fb.className='fb ok';fb.textContent='Now speak. Four sentences.';
        return;}
      const it=s.items[k];
      const d=document.createElement('div');
      d.className='card tight';d.style.cssText='margin-bottom:14px;text-align:left';
      d.innerHTML=`<div style="font-family:var(--mono);font-size:0.78rem;letter-spacing:1.9px;
        color:var(--accent2);text-transform:uppercase;margin-bottom:9px">Check ${k+1} of ${s.items.length}</div>
        <p style="font-size:1.1rem;margin-bottom:14px">${it.q}</p><div class="opts"></div>`;
      const g=d.querySelector('.opts');
      it.o.forEach((txt,idx)=>{
        const b=document.createElement('div');
        b.className='opt row';b.innerHTML=LTR(idx)+txt;
        b.onclick=()=>{
          if(idx===it.a){b.classList.add('right');AU.correct();hit();addXP(25);
            g.querySelectorAll('.opt').forEach(x=>x.classList.add('dead'));
            fb.className='fb ok';fb.textContent=it.why;
            k++;setTimeout(step,1100);}
          else{b.classList.add('wrong');AU.wrong();miss();
            fb.className='fb no';fb.textContent='Not that one. How many? How far?';}
        };g.appendChild(b);
      });
      box.appendChild(d);
    };step();
  }

  if(s.type==='quad'){
    let pick=null;
    const chips=[...document.querySelectorAll('.chip')],cells=[...document.querySelectorAll('.qc')];
    chips.forEach(c=>c.onclick=()=>{
      chips.forEach(x=>x.classList.remove('on'));c.classList.add('on');pick=c;AU.click();
      cells.forEach(x=>{if(!x.classList.contains('ok'))x.classList.add('aim')});
    });
    cells.forEach(cell=>cell.onclick=()=>{
      if(!pick||cell.classList.contains('ok')){
        if(!pick){fb.className='fb no';fb.textContent='Choose a word first.';}
        return;}
      if(cell.dataset.a===pick.dataset.w){
        cell.textContent=pick.dataset.w;cell.classList.add('ok');cell.classList.remove('aim');
        pick.classList.add('used');pick.classList.remove('on');pick=null;
        cells.forEach(x=>x.classList.remove('aim'));
        AU.correct();hit();addXP(20);
        fb.className='fb ok';fb.textContent='Now say it out loud.';
        if(cells.every(x=>x.classList.contains('ok'))){
          burst('THE GRID');addXP(60);
          S.journal.push({k:'the grid',v:'Built the full near/far, one/many grid.'});}
      } else {
        cell.classList.add('bad');setTimeout(()=>cell.classList.remove('bad'),450);
        AU.wrong();miss();fb.className='fb no';
        fb.textContent=/^(this|these)$/.test(pick.dataset.w)?'That one is NEAR you.':'That one is FAR from you.';
      }
    });
  }

  document.querySelectorAll('.st').forEach(x=>{if(!x.onclick)x.onclick=()=>x.classList.toggle('on');});

  if(s.type==='grammar'){
    const cards=[...document.querySelectorAll('.gc')].filter(c=>c.querySelector('.more'));
    const cn=document.getElementById('gcn');
    let abertos=0;
    cards.forEach(c=>c.onclick=()=>{
      const era=c.classList.contains('open');
      c.classList.toggle('open');
      AU.click();
      if(!era){
        abertos++;addXP(10);
        if(cn)cn.textContent=`Tap each card · ${Math.min(abertos,cards.length)} of ${cards.length}`;
        if(abertos===cards.length){AU.unlock();addXP(30);
          if(cn)cn.textContent='All open — now answer each one out loud.';}
      }
    });
  }

  if(s.type==='build'){
    let i=0;
    const slot=document.getElementById('slot'),bank=document.getElementById('bank'),
          num=document.getElementById('bn');
    const load=()=>{
      if(i>=s.sents.length){
        burst('WELL SAID');addXP(60);
        S.journal.push({k:s.journal||'sentences',v:s.sents.length+' sentences built and spoken.'});
        slot.innerHTML='<span class="ph">done</span>';bank.innerHTML='';num.textContent='complete';return;}
      const st=s.sents[i];
      num.textContent=`Sentence ${i+1} of ${s.sents.length}`;
      slot.className='slot';slot.innerHTML='<span class="ph">tap the words in order</span>';
      const mix=[...st.words].sort(()=>Math.random()-.5);
      bank.innerHTML=mix.map((w,k)=>`<span class="word" data-w="${w}" data-k="${k}">${w}</span>`).join('');
      let built=[];
      bank.querySelectorAll('.word').forEach(b=>b.onclick=()=>{
        b.classList.add('used');built.push(b.dataset.w);AU.click();
        slot.innerHTML=built.map(w=>`<span class="word placed">${w}</span>`).join('');
        if(built.length===st.words.length){
          if(built.join(' ')===st.words.join(' ')){
            slot.classList.add('ok');AU.correct();hit();addXP(25);
            fb.className='fb ok';fb.innerHTML=`"${st.say}" — say it out loud.`;
            i++;setTimeout(load,1500);
          } else {
            slot.classList.add('bad');AU.wrong();miss();
            fb.className='fb no';fb.textContent='Not quite. Try the order again.';
            setTimeout(()=>{built=[];slot.className='slot';
              slot.innerHTML='<span class="ph">tap the words in order</span>';
              bank.querySelectorAll('.word').forEach(x=>x.classList.remove('used'));},900);
          }
        }
      });
    };
    load();
  }

  if(s.type==='wheel'){
    const wh=document.getElementById('wh'),hub=document.getElementById('hub'),qc=document.getElementById('qc');
    const n=s.slices.length,seg=360/n;
    let turns=0,spun=0;
    hub.onclick=()=>{
      hub.classList.add('spin');hub.textContent='...';qc.classList.remove('on');
      const k=Math.floor(Math.random()*n);
      turns+=5+Math.floor(Math.random()*3);
      const deg=turns*360-(k*seg+seg/2);
      wh.style.transform=`rotate(${deg}deg)`;
      setTimeout(()=>{
        const sl=s.slices[k];
        qc.innerHTML=`<div class="speak" style="margin-top:0">
          <h3>${sl.q}</h3>
          <div style="font-family:var(--mono);font-size:0.76rem;letter-spacing:1.4px;color:var(--dim);
            text-transform:uppercase;margin-top:14px">say it like this</div>
          <div class="starters"><span class="st">${sl.s}</span></div></div>`;
        qc.classList.add('on');
        qc.querySelector('.st').onclick=function(){this.classList.toggle('on')};
        AU.unlock();spun++;addXP(25);
        hub.classList.remove('spin');hub.textContent='Spin again';
        fb.className='fb ok';fb.textContent=spun+(spun===1?' question answered.':' questions answered.');
        if(spun===5){burst('FIVE SPINS');addXP(60);
          S.journal.push({k:'the wheel',v:'Answered 5 personal questions with demonstratives.'});}
      },4500);
    };
  }

  SFX.clear(); PLAYER.stop();
  document.getElementById('optag').classList.toggle('on',!!s.opt);
  if(s.sfx)setTimeout(()=>SFX.scene(s.sfx.f,s.sfx.v),s.sfx.at||700);

  if(s.type==='wheel'){
    const wh=document.getElementById('wh'),hub=document.getElementById('hub'),qc=document.getElementById('qc');
    const n=s.slices.length,seg=360/n;
    let turns=0,spun=0;
    hub.onclick=()=>{
      hub.classList.add('spin');hub.textContent='...';qc.classList.remove('on');
      const k=Math.floor(Math.random()*n);
      turns+=5+Math.floor(Math.random()*3);
      const deg=turns*360-(k*seg+seg/2);
      wh.style.transform=`rotate(${deg}deg)`;
      setTimeout(()=>{
        const sl=s.slices[k];
        qc.innerHTML=`<div class="speak" style="margin-top:0">
          <h3>${sl.q}</h3>
          <div style="font-family:var(--mono);font-size:0.76rem;letter-spacing:1.4px;color:var(--dim);
            text-transform:uppercase;margin-top:14px">say it like this</div>
          <div class="starters"><span class="st">${sl.s}</span></div></div>`;
        qc.classList.add('on');
        qc.querySelector('.st').onclick=function(){this.classList.toggle('on')};
        AU.unlock();spun++;addXP(25);
        hub.classList.remove('spin');hub.textContent='Spin again';
        fb.className='fb ok';fb.textContent=spun+(spun===1?' question answered.':' questions answered.');
        if(spun===(s.need||5)){burst('LIGHTS ON');addXP(60);
          S.journal.push({k:s.journal||'the wheel',v:'Answered 5 personal questions after the story.'});}
      },4500);
    };
  }

  if(s.type==='people'){
    const tw=document.getElementById('tw'), pc=document.getElementById('pc');
    let vistos=0;
    document.querySelectorAll('.pin3').forEach(pn=>pn.onclick=()=>{
      const x=s.people[+pn.dataset.k];
      document.getElementById('l1').innerHTML=x.every;
      document.getElementById('l2').innerHTML=x.now;
      tw.classList.add('on');
      AU.click();
      if(!pn.classList.contains('done')){
        pn.classList.add('done'); vistos++; addXP(20);
        pc.textContent=`Click a person · ${vistos} of ${s.people.length}`;
        if(vistos===s.people.length){
          burst('THE WHOLE OFFICE'); addXP(50);
          S.journal.push({k:s.journal,v:'Described '+vistos+' people in the office.'});
          pc.textContent='Everybody found. Now describe the office in four sentences.';
        }
      }
      fb.className='fb ok';
      fb.innerHTML=`Say the orange one: "${x.now.replace(/<[^>]+>/g,'')}"`;
    });
  }

  if(s.type==='pair'){
    let i=0, aberto=false;
    const cA=document.getElementById('cA'), cB=document.getElementById('cB'),
          tA=document.getElementById('tA'), tB=document.getElementById('tB'),
          pw=document.getElementById('pw2'), pn=document.getElementById('pn2');
    const pinta=()=>{
      const x=s.items[i];
      aberto=false;
      pw.innerHTML=`person ${i+1} of ${s.items.length} · <b>${x.n}</b>`;
      // o lado que falta alterna: às vezes ele produz o agora, às vezes a rotina
      const pedeAgora = i%2===0;
      cA.className='pc2 '+(pedeAgora?'dado':'pedir');
      cB.className='pc2 '+(pedeAgora?'pedir':'dado');
      tA.innerHTML = pedeAgora ? x.every : 'say it, then tap';
      tB.innerHTML = pedeAgora ? 'say it, then tap' : x.now;
      pn.querySelectorAll('i').forEach((d,k)=>{
        d.classList.toggle('done',k<i); d.classList.toggle('now',k===i);
      });
      fb.className='fb ok';
      fb.innerHTML = pedeAgora
        ? 'You know what she does every day. What is she doing <b>right now</b>?'
        : 'You know what he is doing now. What does he do <b>every day</b>?';
    };
    const revela=()=>{
      if(aberto)return;
      aberto=true;
      const x=s.items[i], pedeAgora=i%2===0;
      const alvo = pedeAgora?cB:cA, txt = pedeAgora?tB:tA;
      txt.innerHTML = pedeAgora ? x.now : x.every;
      alvo.classList.remove('pedir'); alvo.classList.add('aberto');
      AU.correct(); hit(); addXP(25);
      fb.className='fb ok';
      fb.innerHTML='Now read both, one after the other.';
    };
    cA.onclick=()=>{ if(cA.classList.contains('pedir')) revela(); };
    cB.onclick=()=>{ if(cB.classList.contains('pedir')) revela(); };
    pinta();
    document.getElementById('pnext').onclick=function(){
      if(!aberto){fb.className='fb no';fb.textContent='Say it first, then tap the dashed card.';return;}
      i++;
      if(i>=s.items.length){
        burst('BOTH TENSES'); addXP(50);
        S.journal.push({k:s.journal,v:'Completed '+s.items.length+' pairs: routine and right now.'});
        pw.innerHTML='<b>your turn</b>';
        cA.className='pc2 dado'; cB.className='pc2 dado';
        tA.innerHTML='What do you do every day?'; tB.innerHTML='What are you doing right now?';
        pn.querySelectorAll('i').forEach(d=>{d.classList.add('done');d.classList.remove('now')});
        this.style.display='none';
        fb.className='fb ok'; fb.textContent='Two sentences about you. Go.';
        return;
      }
      pinta();
    };
  }

  if(s.type==='bank'){
    let n=0;
    const bn=document.getElementById('bn2');
    const md=document.getElementById('md'), sy=document.getElementById('mdsay'),
          mp=document.getElementById('mdpt'), dc=document.getElementById('mddica');
    document.querySelectorAll('.chip2').forEach(c=>c.onclick=()=>{
      const v=s.verbs[+c.dataset.k];
      sy.innerHTML=v.a+'<span class="gapbtn" data-r="'+v.gap+'">?</span>'+v.b;
      mp.innerHTML=v.pt||''; dc.textContent='tap the line to check';
      md.classList.add('on');
      const g=sy.querySelector('.gapbtn');
      g.onclick=()=>{
        if(g.classList.contains('aberto'))return;
        g.textContent=g.dataset.r; g.classList.add('aberto');
        AU.correct(); addXP(8); dc.textContent='now say the whole sentence again';
      };
      c.classList.add('used'); n++; AU.click(); hit(); addXP(18);
      bn.textContent=`Use ${s.need} of them · ${n} done`;
      fb.className='fb ok';
      fb.innerHTML='Fill the gap out loud. Only then tap it to check.';
      if(n===s.need){
        burst('SIX SENTENCES'); addXP(50);
        S.journal.push({k:s.journal,v:'Described the street with '+n+' different verbs.'});
        bn.textContent='Done. Now say the three best ones again, without stopping.';
      }
    });
  }

  if(s.type==='board'){
    let n=0;
    const qb=document.getElementById('qb2');
    document.querySelectorAll('.qc2').forEach(c=>c.onclick=()=>{
      if(c.classList.contains('up')){
        c.classList.add('feito'); return;
      }
      c.classList.add('up'); n++; AU.click(); addXP(20);
      qb.textContent=`Turn a card · ${n} of ${s.qs.length}`;
      const q=s.qs[+c.dataset.k];
      fb.className='fb ok';
      fb.innerHTML=q.s?`Try starting with: "${q.s}"`:'Answer it out loud.';
      if(n===s.qs.length){
        burst('ALL SIX'); addXP(60);
        S.journal.push({k:s.journal,v:'Answered '+n+' personal questions.'});
        qb.textContent='All six answered. Which one was the hardest?';
      }
    });
  }

  if(s.type==='timeline'){
    let i=0, acertos=0;
    const cs=document.getElementById('tls'), num=document.getElementById('tln');
    const mostra=()=>{
      if(i>=s.items.length){
        burst('ALL THREE');addXP(60);
        S.journal.push({k:s.journal,v:'Placed '+s.items.length+' sentences on the timeline and said them.'});
        cs.innerHTML='<span style="color:var(--ok)">All '+s.items.length+' placed. Now tell the whole story in three sentences — one for each zone.</span>';
        num.textContent='complete';
        document.querySelectorAll('#tld i').forEach(d=>{d.classList.add('done');d.classList.remove('now')});
        return;
      }
      num.textContent=`Sentence ${i+1} of ${s.items.length}`;
      document.querySelectorAll('#tld i').forEach((d,k)=>{
        d.classList.toggle('done',k<i); d.classList.toggle('now',k===i);
      });
      cs.innerHTML=s.items[i].q;
    };
    mostra();
    document.querySelectorAll('.tlz').forEach(z=>z.onclick=()=>{
      if(i>=s.items.length)return;
      const it=s.items[i], k=+z.dataset.z;
      if(k===it.z){
        z.classList.add('hit');setTimeout(()=>z.classList.remove('hit'),700);
        const tag=document.createElement('span');
        tag.className='tlplaced';tag.textContent=it.say;
        z.appendChild(tag);

      const src=d.dataset.bg; if(!src)return;
      const t=new Image();
      t.onload=()=>{d.style.backgroundImage=`url('${src}')`;d.innerHTML='';};
      t.src=src;                                   // se falhar, o ícone continua
    });
    document.querySelectorAll('.pick').forEach(x=>x.onclick=()=>{
      x.classList.toggle('on');AU.click();
      const n=document.querySelectorAll('.pick.on').length;
      if(n){fb.className='fb ok';fb.textContent='Now tell the teacher about it.';addXP(5);}
      else fb.textContent='';
    });
    btn.onclick=()=>{
      if(run)return;run=true;btn.classList.add('run');btn.textContent='Talking';
      const id=setInterval(()=>{
        t--;tn.textContent=fmt(Math.max(t,0));tf.style.width=(100*(s.sec-t)/s.sec)+'%';
        if(t<=0){clearInterval(id);run=false;btn.classList.remove('run');btn.textContent='Again';
          t=s.sec;AU.unlock();addXP(40);
          fb.className='fb ok';fb.textContent='+40 XP · '+Math.round(s.sec/60*10)/10+' minutes of English.';
          if(s.journal)S.journal.push({k:s.journal,v:(s.prompt||'').replace(/~/g,'')+' ('+fmt(s.sec)+')'});}
      },1000);
    };
  }

  if(s.type==='rapid'){
    const btn=document.getElementById('go'),rw=document.getElementById('rw'),tf=document.getElementById('tf');
    let k=0;
    btn.onclick=()=>{
      btn.disabled=true;btn.textContent='GO';
      const step=()=>{
        if(k>=s.items.length){rw.textContent='DONE';burst('RAPID FIRE');addXP(80);
          S.journal.push({k:'rapid fire',v:'6 sentences under time pressure.'});return;}
        rw.textContent=s.items[k];AU.click();k++;
        tf.style.transition='none';tf.style.width='0%';
        setTimeout(()=>{tf.style.transition='width 10s linear';tf.style.width='100%'},40);
        setTimeout(step,10000);
      };step();
    };
  }

  if(s.type==='chat'){
    const box=document.getElementById('chat');let k=0;
    const step=()=>{
      if(k>=s.steps.length){AU.unlock();addXP(60);
        fb.className='fb ok';fb.textContent='Three correct choices. Well handled.';return;}
      const st=s.steps[k];
      const d=document.createElement('div');
      d.className='card tight';d.style.cssText='margin-bottom:14px;text-align:left';
      d.innerHTML=`<div style="font-family:var(--mono);font-size:0.76rem;letter-spacing:1.9px;
        color:var(--accent2);text-transform:uppercase;margin-bottom:8px">Step ${k+1} of ${s.steps.length}</div>
        <p style="font-size:1.06rem;margin-bottom:14px">${st.q}</p><div class="opts"></div>`;
      const g=d.querySelector('.opts');
      st.opts.forEach(o=>{
        const b=document.createElement('div');
        b.className='opt row';b.style.cssText='padding:15px 18px;font-size:.98rem';
        b.innerHTML=LTR(st.opts.indexOf(o))+o.l;
        b.onclick=()=>{
          if(o.ok){b.classList.add('right');AU.correct();hit();addXP(20);
            g.querySelectorAll('.opt').forEach(x=>x.classList.add('dead'));
            k++;setTimeout(step,700);}
          else{b.classList.add('wrong');AU.wrong();miss();}
        };g.appendChild(b);
      });
      box.appendChild(d);
    };step();
  }

  if(s.type==='clear'){burst('LEVEL CLEARED');addXP(s.xp);}
  if(s.type==='clue'){AU.unlock();addXP(s.xp);}
}

/* ============ FUNDO ============ */
const shot=document.getElementById('shot');
const FEATURE=['open','clue','clear','journal','protocol'];
let curBg=null;
function setBg(src,type){
  const feat=FEATURE.includes(type);
  shot.classList.toggle('feature',feat);shot.classList.toggle('ambient',!feat);
  if(src===curBg)return;curBg=src;
  if(!src){shot.classList.remove('on');return;}
  const pre=new Image();
  pre.onload=()=>{shot.style.backgroundImage=`url('${src}')`;shot.classList.add('on')};
  pre.src=src;
}
[...new Set(L.map(x=>x.bg).filter(Boolean))].forEach(s=>{const i=new Image();i.src=s});
document.addEventListener('mousemove',e=>{
  if(!shot.classList.contains('on'))return;
  const x=(e.clientX/innerWidth-.5),y=(e.clientY/innerHeight-.5);
  shot.style.transform=`scale(1.06) translate(${-x*14}px,${-y*10}px)`;
});

/* ============ UI ============ */
function ui(){
  const s=L[S.i];
  setBg(s.bg||null,s.type);
  document.getElementById('chap').textContent=s.ch||'';
  document.getElementById('cnt').textContent='SCENE '+(S.i+1)+' / '+L.length+(s.beat!=='—'?' · '+s.beat:'');
  document.getElementById('fill').style.width=(100*S.i/(L.length-1))+'%';
  document.getElementById('prev').classList.toggle('ghost',S.i===0);
  document.getElementById('next').classList.toggle('ghost',S.i===L.length-1);
  const t=s.teacher;
  document.getElementById('tnBody').innerHTML=
    `<div class="blk"><b>Time</b><p>${t.sec}</p></div>
     <div class="blk"><b>What to do</b><p>${t.do}</p></div>
     <div class="blk"><b>Watch for</b><p>${t.watch}</p></div>
     <div class="blk"><b>If they get stuck</b><p>${t.stuck}</p></div>
     <div class="blk"><b>If they are strong</b><p>${t.strong}</p></div>`;
}
/* a seta NUNCA trava: o professor manda no ritmo, não o exercício */
function go(i){
  if(i<0||i>=L.length)return;
  S.i=i;gEl.classList.remove('on');render();
  document.getElementById('stage').scrollTop=0;
}
document.getElementById('next').onclick=()=>go(S.i+1);
document.getElementById('prev').onclick=()=>go(S.i-1);
document.getElementById('tnBtn').onclick=function(){
  document.getElementById('tn').classList.toggle('open');this.classList.toggle('on')};
document.getElementById('replay').onclick=()=>SFX.again();

/* ============ A LOUSA ============ */
const BD=(function(){
  const KEY='rightnow-board';
  const el=document.getElementById('board2'),ta=document.getElementById('bdTxt'),
        btn=document.getElementById('bdBtn'),scrim=document.getElementById('bscrim'),
        saved=document.getElementById('bdSaved');
  let t=null;
  ta.value=localStorage.getItem(KEY)||'';
  const mark=()=>btn.classList.toggle('hasnote',!!ta.value.trim());
  mark();
  const store=()=>{
    localStorage.setItem(KEY,ta.value);mark();
    saved.classList.add('on');clearTimeout(t);
    t=setTimeout(()=>saved.classList.remove('on'),1400);
  };
  ta.addEventListener('input',store);
  const open=v=>{
    el.classList.toggle('on',v);scrim.classList.toggle('on',v);
    if(v)setTimeout(()=>ta.focus(),380);
  };
  btn.onclick=()=>open(!el.classList.contains('on'));
  document.getElementById('bdX').onclick=()=>open(false);
  scrim.onclick=()=>open(false);
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&el.classList.contains('on'))open(false);
  });
  document.querySelectorAll('.board2 .tg').forEach(b=>b.onclick=()=>{
    const tag=b.dataset.t==='SCENE'?`[SCENE ${S.i}] `:`[${b.dataset.t}] `;
    const p=ta.selectionStart,v=ta.value;
    const nl=(p>0&&v[p-1]!=='\n')?'\n':'';
    ta.value=v.slice(0,p)+nl+tag+v.slice(p);
    ta.focus();ta.selectionStart=ta.selectionEnd=p+nl.length+tag.length;
    store();AU.click();
  });
  const full=()=>{
    const j=S.journal.length
      ? '\n\n--- WHAT THE STUDENT DID ---\n'+S.journal.map(x=>`· ${x.k}: ${x.v}`).join('\n')
      : '';
    return `RIGHT NOW — A1 — ${new Date().toLocaleDateString()}\n`
      +`Scene ${S.i} of ${L.length-1} · ${S.xp} XP\n\n`
      +(ta.value.trim()||'(no notes)')+j+'\n';
  };
  document.getElementById('bdCopy').onclick=function(){
    navigator.clipboard.writeText(full()).then(()=>{
      this.textContent='Copied';setTimeout(()=>this.textContent='Copy',1600);
    }).catch(()=>{ta.select();document.execCommand('copy');});
  };
  document.getElementById('bdDl').onclick=()=>{
    const b=new Blob([full()],{type:'text/plain;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download='right-now-notes.txt';a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  };
  document.getElementById('bdClear').onclick=function(){
    if(this.dataset.sure){ta.value='';store();delete this.dataset.sure;this.textContent='Clear';return;}
    this.dataset.sure='1';this.textContent='Sure?';
    setTimeout(()=>{delete this.dataset.sure;this.textContent='Clear';},2600);
  };
  return {open};
})();

};

const fsBtn=document.getElementById('fsBtn'),fsIco=document.getElementById('fsIco');
const EXPAND='<path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/>';
const SHRINK='<path d="M9 4v4a1 1 0 0 1-1 1H4M20 9h-4a1 1 0 0 1-1-1V4M15 20v-4a1 1 0 0 1 1-1h4M4 15h4a1 1 0 0 1 1 1v4"/>';
fsBtn.onclick=()=>{
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(()=>{});
};
document.addEventListener('fullscreenchange',()=>{
  const on=!!document.fullscreenElement;
  fsIco.innerHTML=on?SHRINK:EXPAND;
  fsBtn.classList.toggle('on',on);
  fsBtn.title=on?'Exit fullscreen':'Fullscreen';
});
document.getElementById('tnClose').onclick=()=>{
  document.getElementById('tn').classList.remove('open');
  document.getElementById('tnBtn').classList.remove('on')};
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')go(S.i+1);
  if(e.key==='ArrowLeft')go(S.i-1);
  if(e.key==='f'||e.key==='F'){if(!/input|textarea/i.test(e.target.tagName))fsBtn.click();}
  if(e.key==='Escape'){gEl.classList.remove('on');
    document.getElementById('tn').classList.remove('open');
    document.getElementById('tnBtn').classList.remove('on');}
});
document.addEventListener('click',()=>AU.init(),{once:true});
window.wolfScene=()=>'s'+S.i;
render();
